name: Build & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        include:
          - preset: debug
            config: Debug
            build_tests: 'ON'
          - preset: release
            config: Release
            build_tests: 'OFF'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies for asset generation
        run: pip install pillow numpy scipy

      - name: Configure
        shell: pwsh
        run: |
          $vRoot = if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            $env:VCPKG_INSTALLATION_ROOT
          } elseif (Test-Path "C:\vcpkg\scripts\buildsystems\vcpkg.cmake") {
            "C:\vcpkg"
          } else {
            $null
          }
          if ($vRoot) {
            Write-Host "Found vcpkg at: $vRoot"
            $env:VCPKG_ROOT = $vRoot
            cmake --preset ${{ matrix.preset }}
          } else {
            Write-Host "No vcpkg toolchain found, configuring natively with MSVC"
            cmake -B build/${{ matrix.preset }} -G "Visual Studio 17 2022" -A x64 -D CMAKE_BUILD_TYPE=${{ matrix.config }} -D DUWN_BUILD_TESTS=${{ matrix.build_tests }}
          }

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Test (debug only)
        if: matrix.preset == 'debug'
        working-directory: build/debug
        run: ctest --output-on-failure -C Debug

      - name: Upload build artifacts
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: duwn-mirror-release
          path: build/release/bin/
