name: Build & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        include:
          - preset: debug
            config: Debug
            build_tests: 'ON'
          - preset: release
            config: Release
            build_tests: 'OFF'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies for asset generation
        run: pip install pillow numpy scipy

      - name: Configure
        shell: pwsh
        run: |
          Write-Host "Configuring ${{ matrix.preset }}..."
          if ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          } elseif (Test-Path "C:\vcpkg") {
            $env:VCPKG_ROOT = "C:\vcpkg"
          }
          Write-Host "VCPKG_ROOT is: $env:VCPKG_ROOT"

          $res = cmake --preset ${{ matrix.preset }} 2>&1
          $res | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Preset failed (exit code $LASTEXITCODE). Retrying without preset..."
            $res2 = cmake -B build/${{ matrix.preset }} -A x64 -D CMAKE_BUILD_TYPE=${{ matrix.config }} -D DUWN_BUILD_TESTS=${{ matrix.build_tests }} 2>&1
            $res2 | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              $res | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $res2 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 1
            }
          }

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Test (debug only)
        if: matrix.preset == 'debug'
        working-directory: build/debug
        run: ctest --output-on-failure -C Debug

      - name: Upload build artifacts
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: duwn-mirror-release
          path: build/release/bin/
