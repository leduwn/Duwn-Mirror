name: Build & Test

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        include:
          - preset: debug
            config: Debug
          - preset: release
            config: Release

    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-brand-assets.txt

      - name: Install Python dependencies for asset generation
        run: python -m pip install --disable-pip-version-check -r tools/requirements-brand-assets.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} -- /fl /flp:logfile=build-errors.log
          $ec = $LASTEXITCODE
          if (Test-Path build-errors.log) {
            Get-Content build-errors.log | Where-Object { $_ -match ": error" } | ForEach-Object { Write-Host "::error title=MSBuildError::$_" }
          }
          if ($ec -ne 0) { exit $ec }

      - name: Test headless-safe suite (debug only)
        if: matrix.preset == 'debug'
        working-directory: build/debug
        run: ctest --output-on-failure -C Debug -L headless

      - name: Upload build artifacts
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: duwn-mirror-release
          path: build/release/bin/
