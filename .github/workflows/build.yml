name: Build & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        include:
          - preset: debug
            config: Debug
          - preset: release
            config: Release

    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies for asset generation
        run: pip install pillow numpy scipy

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} -- /fl /flp:logfile=build-errors.log
          $ec = $LASTEXITCODE
          if (Test-Path build-errors.log) {
            Get-Content build-errors.log | Where-Object { $_ -match ": error" } | ForEach-Object { Write-Host "::error title=MSBuildError::$_" }
          }
          if ($ec -ne 0) { exit $ec }

      - name: Test (debug only)
        if: matrix.preset == 'debug'
        working-directory: build/debug
        run: ctest --output-on-failure -C Debug

      - name: Upload build artifacts
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: duwn-mirror-release
          path: build/release/bin/
